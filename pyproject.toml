[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paralia_sdk"
version = "0.1.0"
description = "Internal client SDK + shared geometry utilities for Paralia's apps (paradigm, parable, and future tools)."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "requests",
]

[tool.setuptools.packages.find]
include = ["paralia_sdk*"]
